<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Medical Shop</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="home">
        <h1>Welcome to the Medical Shop</h1>
        <p>Your health is our priority. Shop for trusted medicines and health products.</p>
        <button id="shopNowBtn">Shop Now</button>
    </section>

    <section id="products">
        <h2>Our Products</h2>
        <div class="product-card">
            <img src="medicine1.jpg" alt="Medicine 1">
            <h3>Medicine 1</h3>
            <p>Description</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="medicine2.jpg" alt="Medicine 2">
            <h3>Medicine 2</h3>
            <p>Description</p>
            <button>Buy Now</button>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Medical Shop. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
